x-domain-note: >-
  No company-controlled domain was found for 8 Financial Intelligence. The obvious brand
  candidates were probed and every one of them is a parked or brokered domain rather than a
  company property: 8fi.com is on Sedo nameservers and its apex 403s straight to a Sedo sales
  lander, 8fi.ai resolves to a parity.domains parking lander with an empty <title>, 8fi.co
  times out, eightfi.com 200s onto a namebamboo.com "premium asset" for-sale page, and
  8fi.net, 8fi.hk, 8fi.com.hk, 8fi.global, 8fi.asia, 8fi.group, 8fi.tech, 8fi.dev,
  8fi.finance, eightfi.ai, 8financialintelligence.com, 8financialintelligence.ai,
  snyamic.com, snyamic.hk, snyamic.io and snyamic.tech do not resolve in DNS at all. No
  GitHub organisation matching the brand exists either. Because there is no host attributable
  to the company, no Website pointer is wired and no contract, well-known, agent-card or
  llms.txt probe could be run against a company property — the STEP 0b discovery sweep had
  nowhere to point.

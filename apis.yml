aid: 8financialservices
name: 8 Financial Intelligence
description: >-
  8 Financial Intelligence (8FI) is a privately held artificial-intelligence research and
  deployment company focused on financial engineering, established in 2016 under the name
  Snyamic Technology Limited (動力科創有限公司) and headquartered in Hong Kong SAR, with stated
  operations and partnerships in Cyprus, Estonia, Israel, Singapore and the United States.
  Its publicly stated positioning is autonomous AI and financial-engineering systems rather
  than a packaged product, and its only reported financing is HKD 2.3 billion (roughly USD
  300 million) from Parallel Strategy, an alternative asset manager investing in large-scale
  AI technology and infrastructure. Every one of these facts is drawn from a single public
  source — the EquityZen secondary-market listing recorded below — because API Evangelist
  could not locate a company-controlled website, developer portal, documentation host,
  GitHub organisation or any other first-party property for 8 Financial Intelligence. The
  company therefore has no observable API surface: no public API, SDK, webhook catalogue,
  MCP server, agent card or machine-readable specification of any kind was found, and none
  could be probed, because no host attributable to the company was discoverable to probe.
  This profile is a factual record of what is publicly observable, not an assessment of the
  company's technology.
